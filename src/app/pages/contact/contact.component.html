<p>contact works!</p>
<div
  class="contact-container max-w-3xl mx-auto p-8 bg-white rounded-lg shadow-md"
>
  <h1 class="text-4xl font-bold mb-6 text-center text-gray-800">Contact Us</h1>
  <form [formGroup]="queryForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1"
        >Name *</label
      >
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500': submitted && queryForm.get('name')?.errors
        }"
      />
      <div
        *ngIf="submitted && queryForm.get('name')?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Name is required
      </div>
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
        >Email *</label
      >
      <input
        type="email"
        id="email"
        formControlName="email"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500': submitted && queryForm.get('email')?.errors
        }"
      />
      <div
        *ngIf="submitted && queryForm.get('email')?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Email is required
      </div>
      <div
        *ngIf="submitted && queryForm.get('email')?.errors?.['email']"
        class="text-red-500 text-sm mt-1"
      >
        Please enter a valid email
      </div>
    </div>

    <div>
      <label for="phone" class="block text-sm font-medium text-gray-700 mb-1"
        >Phone *</label
      >
      <input
        type="tel"
        id="phone"
        formControlName="phone"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500': submitted && queryForm.get('phone')?.errors
        }"
      />
      <div
        *ngIf="submitted && queryForm.get('phone')?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Phone number is required
      </div>
    </div>

    <div>
      <label
        for="propertyType"
        class="block text-sm font-medium text-gray-700 mb-1"
        >Property Type *</label
      >
      <select
        id="propertyType"
        formControlName="propertyType"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500': submitted && queryForm.get('propertyType')?.errors
        }"
      >
        <option value="">Select Property Type</option>
        <option value="house">House</option>
        <option value="apartment">Apartment</option>
        <option value="condo">Condo</option>
        <option value="land">Land</option>
      </select>
      <div
        *ngIf="submitted && queryForm.get('propertyType')?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Property type is required
      </div>
    </div>

    <div>
      <label for="location" class="block text-sm font-medium text-gray-700 mb-1"
        >Preferred Location *</label
      >
      <input
        type="text"
        id="location"
        formControlName="location"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngClass]="{
          'border-red-500': submitted && queryForm.get('location')?.errors
        }"
      />
      <div
        *ngIf="submitted && queryForm.get('location')?.errors?.['required']"
        class="text-red-500 text-sm mt-1"
      >
        Location is required
      </div>
    </div>

    <div>
      <label for="message" class="block text-sm font-medium text-gray-700 mb-1"
        >Additional Message</label
      >
      <textarea
        id="message"
        formControlName="message"
        rows="4"
        class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      ></textarea>
    </div>

    <div class="flex justify-center">
      <button
        type="submit"
        class="px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        Submit Query
      </button>
    </div>

    <div *ngIf="submitSuccess" class="text-green-600 text-center mt-4">
      Thank you! Your query has been submitted successfully.
    </div>

    <div *ngIf="submitError" class="text-red-600 text-center mt-4">
      Sorry, there was an error submitting your query. Please try again.
    </div>
  </form>
</div>
