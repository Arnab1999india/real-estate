<div class="property-card border rounded-lg shadow-md overflow-hidden">
  <img
    [src]="property.imageUrl"
    [alt]="property.title"
    class="w-full h-48 object-cover"
  />
  <div class="p-4">
    <h2 class="text-xl font-semibold mb-2">{{ property.title }}</h2>
    <p class="text-gray-600 mb-1">{{ property.location }}</p>
    <p class="text-indigo-600 font-bold mb-1">
      \${{ property.price | number }}
    </p>
    <p class="text-gray-700 mb-3">
      {{ property.bedrooms }} beds | {{ property.bathrooms }} baths |
      {{ property.area }} sqft
    </p>
    <p class="text-gray-600 mb-4">{{ property.description }}</p>
    <button
      class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded"
      (click)="viewDetails()"
    >
      View Property Details
    </button>
  </div>
</div>
